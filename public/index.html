<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#140a0c" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <title>CyberLearn — Interactive Cybersecurity Study Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="read-progress" class="read-progress"></div>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">🛡️</div>
        <div class="brand-text">
          <span class="brand-name">CyberLearn</span>
          <span class="brand-tag">Study Platform</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="streak-mini" id="streak-mini"></div>
      </div>
    </aside>

    <div class="main-col">
      <header id="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="Toggle menu">☰</button>
        <h1 id="view-title" class="view-title">Dashboard</h1>
        <div class="topbar-right">
          <div class="streak-badge" id="streak-badge" title="Day streak"></div>
          <div class="sync-indicator" id="sync-indicator" title="Cloud sync"></div>
        </div>
        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search lessons, terms…" autocomplete="off" />
          <div id="search-results" class="search-results hidden"></div>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <!-- AI Tutor -->
  <button id="tutor-fab" class="tutor-fab" aria-label="Open AI tutor" title="AI tutor">🤖</button>
  <div id="tutor-panel" class="tutor-panel hidden">
    <div class="tutor-head">
      <div class="tutor-title"><span class="tutor-emoji">🤖</span> AI Tutor</div>
      <button id="tutor-close" class="tutor-close" aria-label="Close">✕</button>
    </div>
    <div class="tutor-usage" id="tutor-usage" title="Tokens used today vs. your daily budget">
      <div class="tutor-usage-bar"><span id="tutor-usage-fill"></span></div>
      <div class="tutor-usage-text" id="tutor-usage-text">0 tokens used</div>
    </div>
    <div id="tutor-messages" class="tutor-messages"></div>
    <div class="tutor-input-row">
      <textarea id="tutor-input" class="tutor-input" placeholder="Ask about your studies…" rows="1"></textarea>
      <button id="tutor-send" class="tutor-send" aria-label="Send">➤</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="diagrams.js"></script>
  <script src="app.js"></script>
</body>
</html>
