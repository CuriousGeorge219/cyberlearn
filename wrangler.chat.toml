# Cloudflare Worker config for the CyberLearn AI tutor chat proxy.
# Deploy:  npx wrangler deploy -c wrangler.chat.toml
# Secret:  npx wrangler secret put LLM_API_KEY -c wrangler.chat.toml

name = "cyberlearn-chat"
main = "chat-worker.js"
compatibility_date = "2024-11-01"

[vars]
LLM_BASE_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemma-4-31b-it:free"
